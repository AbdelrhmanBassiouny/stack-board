name: plan-dashboards

# Publishes every plan dashboard of the public fork, plus the index linking them, to this
# repository's own GitHub Pages site. It is kept apart from the fork because the fork's
# Pages already serves its documentation. A workflow only sees events in its own
# repository, so it polls on a schedule and can be dispatched by hand or through the API.
# It only reads the fork and never writes to it.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

env:
  FORK_REPOSITORY: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
  # The fork branch whose basstler renders the site. Points at the branch that adds
  # basstler.build_site until that lands on main, then becomes main.
  RENDERER_REF: claude/plan-dashboard-multi-account-y2vexc
  NOTES_BRANCH: claude/personal-notes
  PLANS_DIRECTORY: .claude/personal/plans
  # GitHub disables a public repository's schedules after 60 days without a commit, and
  # nothing else commits here, so the build commits once before that happens.
  KEEP_ALIVE_AFTER_DAYS: 50

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: plan-dashboards
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: site-repository

      - name: Check out the fork's renderer
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FORK_REPOSITORY }}
          ref: ${{ env.RENDERER_REF }}
          path: renderer
          sparse-checkout: basstler

      - name: Check out the fork's plans
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FORK_REPOSITORY }}
          ref: ${{ env.NOTES_BRANCH }}
          path: notes
          sparse-checkout: ${{ env.PLANS_DIRECTORY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the renderer's dependencies
        run: pip install ./renderer/basstler

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the site
        working-directory: renderer
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m basstler.build_site
          --plans-directory "${GITHUB_WORKSPACE}/notes/${PLANS_DIRECTORY}"
          --site-url "${{ steps.pages.outputs.base_url }}"
          --output "${GITHUB_WORKSPACE}/_site"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Keep the schedule enabled
        working-directory: site-repository
        run: |
          last_commit=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last_commit )) -lt $(( KEEP_ALIVE_AFTER_DAYS * 86400 )) ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty --message "Keep the scheduled dashboard build enabled"
          git push
